; Unity Runtime Bridge 配置
; ---------------------------------------------------------------------------
; 这份 ini 同时被两侧读取：
;   · C# 侧：决定监听端口、监听地址、是否校验令牌、是否自动开服
;   · Python 侧：决定连哪个端口、用什么令牌、超时多久
; 放在 StreamingAssets 下，会随游戏一起打包，现场不需要再单独拷一份配置。
;
; 语法：[节] / key = value；支持 ; 或 # 行内注释；值前后空格会被忽略。
; 文件缺失或某项写错时，该项回退到内置默认值，不影响游戏启动。

[server]
; 监听端口。故意与 unity-python-bridge 的 21927 错开，两个桥可以同时开着互不干扰。
port = 21928

; 监听地址。默认只绑本机回环，局域网内其它机器连不上。
; 改成 any 会监听所有网卡（等于把游戏交给整个局域网操作，风险自负）。
bind = 127.0.0.1

; 访问令牌。留空 = 不校验（开发期省事）；发布版建议填一串随机字符。
; 填了之后所有请求都要带同样的 token，见 [python] 段。
token =

; 游戏启动时是否自动开服。设 false 则需要在代码里显式调用 RuntimeBridgeServer.Start()。
autostart = true

; 每帧执行命令的时间预算（毫秒）。超出的命令留到下一帧，避免一帧内堆太多命令造成卡顿。
flush_budget_ms = 8

; 命令队列积压上限。超过就直接回错误，避免调用方疯狂重试把游戏拖死。
max_queued = 64

; 是否把每条命令的名称与耗时写进日志（排障用；发布版建议 false）。
log_commands = false

[python]
; Python 客户端专用。C# 侧不读这一段。
; 留空表示按顺序回退：[server] 的同名字段 → 内置默认值。

; 连接地址。一般不用改，服务器默认也只允许本机连接。
host =

; 连接端口。留空则用上面 [server] port。
port =

; 访问令牌。留空则用上面 [server] token。
token =

; 单次请求的超时秒数（连接 + 等待响应）。
timeout = 10
